# Local development profile - active by default (see application.properties).
spring.jpa.show-sql=true
logging.level.com.quoteguard=DEBUG
logging.level.org.hibernate.SQL=DEBUG

management.endpoint.health.show-details=always

# Convenient for local iteration; devtools already ships with the app in
# every profile, but restart-on-classpath-change is only useful here.
spring.devtools.restart.enabled=true
