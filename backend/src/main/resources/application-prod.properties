# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.quoteguard=INFO
logging.level.org.hibernate.SQL=WARN

# Health details (DB status, disk space, etc.) are not exposed to
# unauthenticated callers in production - "when-authorized" has no effect
# here since the health endpoint itself is intentionally public for
# orchestrator probes (see SecurityConfig), so this is pinned to "never".
management.endpoint.health.show-details=never

# No fallback default in production: if JWT_SECRET is not set, startup
# fails immediately with a clear "could not resolve placeholder" error
# instead of silently signing every access token with the well-known
# development secret committed in application.properties.
app.jwt.secret=${JWT_SECRET}

spring.devtools.restart.enabled=false
