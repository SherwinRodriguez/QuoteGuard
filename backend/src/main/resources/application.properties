spring.application.name=backend

# Active profile - "dev" locally by default; set SPRING_PROFILES_ACTIVE=prod
# in any real deployment (docker-compose.yml sets this for the backend
# service). See application-dev.properties / application-prod.properties.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database connection - every value is env-var-overridable. The defaults
# below are for local development ONLY (a throwaway local Postgres
# instance) and must be overridden via DB_URL / DB_USERNAME / DB_PASSWORD
# in any shared/deployed environment. Nothing here is a real credential.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quoteguard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway now owns the schema (see src/main/resources/db/migration). "validate"
# means Hibernate checks entities against the actual schema at startup and
# fails fast on drift, instead of "update" silently patching the live schema
# on every boot - the previous setting, which is not reproducible and not
# safe with more than one developer or environment.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true

# Open Session In View is Spring Boot's default (true) and is deliberately
# disabled here. OSIV keeps the Hibernate session open for the entire
# request, which "papers over" missing @Transactional boundaries by letting
# lazy associations load during response serialization - at the cost of
# holding a DB connection for the whole request and enabling accidental
# N+1 queries at the view layer. Every service method that touches a lazy
# association (Invoice.items, Client.invoices) now has an explicit
# @Transactional / @Transactional(readOnly = true) boundary instead - see
# InvoiceService and ClientService.
spring.jpa.open-in-view=false

# QuoteGuard Configuration
app.verification.base-url=${APP_VERIFICATION_BASE_URL:http://localhost:3000}

# Directory PDFs are written to and served from (relative to the working
# directory, or absolute). Matches the quoteguard_invoices volume mount in
# docker-compose.yml (/app/generated/invoices) - if you change this, update
# that mount to point at the same path or PDFs won't survive a container
# restart.
app.storage.pdf-dir=${PDF_STORAGE_DIR:generated/invoices}

# JWT Configuration
# app.jwt.secret MUST be overridden via the JWT_SECRET environment variable in any
# non-local environment (staging/production). The default below is a throwaway
# local-development-only secret and must never be used outside a developer laptop.
# HS256 requires a key of at least 256 bits (32 bytes) - the default satisfies that.
# application-prod.properties removes this default entirely, so a production
# boot without JWT_SECRET set fails fast at startup instead of silently
# signing tokens with a publicly-known secret.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-32-bytes-minimum-xyz123}
# Access token lifetime in milliseconds - kept short (15 min) by design.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Refresh token lifetime in milliseconds - 7 days. Refresh tokens are opaque,
# server-side-revocable, rotated on every use (see RefreshTokenService), and
# stored in Postgres as a SHA-256 hash, never in plaintext.
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Actuator - health/readiness probes for Docker Compose and any future
# orchestrator. Only "health" and "info" are exposed by default; the rest of
# Actuator's surface (env, beans, threaddump, etc.) is NOT exposed, since
# that's a real information-disclosure risk if left open on a public API.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# springdoc-openapi - see OpenApiConfig for the JWT bearer security scheme
# registration that makes Swagger UI's "Authorize" button work.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
