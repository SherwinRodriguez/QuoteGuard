name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # NOTE: pom.xml's parent is spring-boot-starter-parent:4.0.0-SNAPSHOT,
    # resolved from Spring's snapshot repository. This job's reproducibility
    # is only as good as that snapshot's - the identical commit can pass
    # today and fail tomorrow with no code change, purely because the
    # snapshot content moved. Flagged repeatedly elsewhere (see
    # QUOTEGUARD_ARCHITECTURE.md); pinning to a GA release removes this
    # risk entirely but needs a working compiler in the loop to verify, not
    # a blind edit here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quoteguard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/quoteguard
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-only-secret-never-used-outside-this-pipeline-32b
        run: ./mvnw -B clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build
